<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 800 320"><style>text{font-family:-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,sans-serif}.label{font-size:13px;fill:#1a1a2e;font-weight:500}.sublabel{font-size:11px;fill:#6b7280}.arrow,.box{stroke-width:1.5}.arrow{stroke:#94a3b8;fill:none;marker-end:url(#arrowhead)}.box{rx:8;ry:8}.step{fill:#f0f7ff;stroke:#3b82f6}.action-safe{fill:#f0fdf4;stroke:#22c55e}.action-approval{fill:#fefce8;stroke:#eab308}.action-block{fill:#fef2f2;stroke:#ef4444}.start{fill:#e0e7ff;stroke:#6366f1}</style><defs><marker id="arrowhead" markerHeight="6" markerWidth="8" orient="auto" refX="8" refY="3"><polygon fill="#94a3b8" points="0 0 8 3 0 6"/></marker></defs><rect width="120" height="50" x="20" y="130" class="box start"/><text x="80" y="152" class="label" text-anchor="middle">Your question</text><text x="80" y="167" class="sublabel" text-anchor="middle">or incident alert</text><line x1="140" x2="170" y1="155" y2="155" class="arrow"/><rect width="110" height="50" x="170" y="130" class="box step"/><text x="225" y="152" class="label" text-anchor="middle">Understand</text><text x="225" y="167" class="sublabel" text-anchor="middle">parse request</text><line x1="280" x2="310" y1="155" y2="155" class="arrow"/><rect width="110" height="50" x="310" y="130" class="box step"/><text x="365" y="152" class="label" text-anchor="middle">Gather context</text><text x="365" y="167" class="sublabel" text-anchor="middle">parallel queries</text><line x1="420" x2="450" y1="155" y2="155" class="arrow"/><rect width="110" height="50" x="450" y="130" class="box step"/><text x="505" y="152" class="label" text-anchor="middle">Reason</text><text x="505" y="167" class="sublabel" text-anchor="middle">analyze patterns</text><line x1="560" x2="620" y1="145" y2="70" class="arrow"/><line x1="560" x2="620" y1="155" y2="155" class="arrow"/><line x1="560" x2="620" y1="165" y2="240" class="arrow"/><rect width="160" height="50" x="620" y="45" class="box action-safe"/><text x="700" y="67" class="label" text-anchor="middle">Execute</text><text x="700" y="82" class="sublabel" text-anchor="middle">safe actions run immediately</text><rect width="160" height="50" x="620" y="130" class="box action-approval"/><text x="700" y="152" class="label" text-anchor="middle">Ask for approval</text><text x="700" y="167" class="sublabel" text-anchor="middle">destructive actions wait</text><rect width="160" height="50" x="620" y="215" class="box action-block"/><text x="700" y="237" class="label" text-anchor="middle">Respond</text><text x="700" y="252" class="sublabel" text-anchor="middle">present findings</text><path d="M 505 180 C 505 220, 365 220, 365 180" class="arrow" style="stroke-dasharray:4 3"/><text x="435" y="235" class="sublabel" text-anchor="middle">iterate (up to 10×)</text><text x="20" y="300" class="sublabel">Your agent adjusts reasoning depth automatically — simple questions get quick answers, complex incidents get multistep analysis.</text></svg>