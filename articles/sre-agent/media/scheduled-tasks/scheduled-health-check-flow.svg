<svg xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" viewBox="0 0 900 320"><rect width="100%" height="100%" fill="#fff"/><text x="450" y="30" fill="#333" font-size="18" font-weight="bold" text-anchor="middle">Automated Health Check Workflow</text><g transform="translate(100, 90)"><circle cx="0" cy="0" r="40" fill="#5E35B1" stroke="#4527A0" stroke-width="2"/><text x="0" y="-20" fill="#fff" font-size="28" text-anchor="middle">🕒</text><text x="0" y="5" fill="#fff" font-size="11" font-weight="bold" text-anchor="middle">Schedule</text><text x="0" y="60" fill="#555" font-size="10" text-anchor="middle">Daily at 8 AM</text><text x="0" y="73" fill="#555" font-size="10" text-anchor="middle">Every hour</text><text x="0" y="86" fill="#555" font-size="10" text-anchor="middle">Weekly on Mon</text></g><g transform="translate(280, 90)"><rect width="100" height="80" x="-50" y="-40" fill="#1976D2" stroke="#0D47A1" stroke-width="2" rx="8"/><text x="0" y="-12" fill="#fff" font-size="13" font-weight="bold" text-anchor="middle">Agent Runs</text><text x="0" y="5" fill="#fff" font-size="13" font-weight="bold" text-anchor="middle">Automatically</text><text x="0" y="60" fill="#555" font-size="10" text-anchor="middle">No manual trigger</text><text x="0" y="73" fill="#555" font-size="10" text-anchor="middle">Runs even if you&apos;re</text><text x="0" y="86" fill="#555" font-size="10" text-anchor="middle">offline</text></g><g transform="translate(460, 90)"><rect width="100" height="80" x="-50" y="-40" fill="#F57C00" stroke="#E65100" stroke-width="2" rx="8"/><text x="0" y="-12" fill="#fff" font-size="13" font-weight="bold" text-anchor="middle">Analyzes</text><text x="0" y="5" fill="#fff" font-size="13" font-weight="bold" text-anchor="middle">Systems</text><text x="0" y="60" fill="#555" font-size="9" text-anchor="middle">Checks health metrics</text><text x="0" y="72" fill="#555" font-size="9" text-anchor="middle">Reviews error rates</text><text x="0" y="84" fill="#555" font-size="9" text-anchor="middle">Verifies backups</text><text x="0" y="96" fill="#555" font-size="9" text-anchor="middle">Validates configs</text></g><g transform="translate(640, 90)"><rect width="100" height="80" x="-50" y="-40" fill="#388E3C" stroke="#2E7D32" stroke-width="2" rx="8"/><text x="0" y="-12" fill="#fff" font-size="13" font-weight="bold" text-anchor="middle">Reports</text><text x="0" y="5" fill="#fff" font-size="13" font-weight="bold" text-anchor="middle">Findings</text><text x="0" y="60" fill="#555" font-size="9" text-anchor="middle">Posts to Teams</text><text x="0" y="72" fill="#555" font-size="9" text-anchor="middle">Creates tickets</text><text x="0" y="84" fill="#555" font-size="9" text-anchor="middle">Sends email</text><text x="0" y="96" fill="#555" font-size="9" text-anchor="middle">Updates dashboard</text></g><g transform="translate(820, 90)"><rect width="100" height="80" x="-50" y="-40" fill="#D32F2F" stroke="#B71C1C" stroke-width="2" rx="8"/><text x="0" y="-18" fill="#fff" font-size="12" font-weight="bold" text-anchor="middle">Optionally</text><text x="0" y="-3" fill="#fff" font-size="12" font-weight="bold" text-anchor="middle">Takes Action</text><text x="0" y="60" fill="#555" font-size="9" text-anchor="middle">Restarts services</text><text x="0" y="72" fill="#555" font-size="9" text-anchor="middle">Scales resources</text><text x="0" y="84" fill="#555" font-size="9" text-anchor="middle">Clears caches</text><text x="0" y="96" fill="#555" font-size="9" text-anchor="middle">(if Autonomous)</text></g><path fill="none" stroke="#333" stroke-width="2" marker-end="url(#arrowHealth)" d="M 145 90 L 225 90"/><path fill="none" stroke="#333" stroke-width="2" marker-end="url(#arrowHealth)" d="M 335 90 L 405 90"/><path fill="none" stroke="#333" stroke-width="2" marker-end="url(#arrowHealth)" d="M 515 90 L 585 90"/><path fill="none" stroke="#333" stroke-width="2" marker-end="url(#arrowHealth)" d="M 695 90 L 765 90"/><path fill="none" stroke="#9E9E9E" stroke-dasharray="5 5" stroke-width="2" marker-end="url(#arrowHealthDashed)" d="M 100 130 Q 100 260 850 230 Q 880 220 880 90"/><text x="450" y="270" fill="#666" font-size="12" text-anchor="middle">Repeats on schedule</text><defs><marker id="arrowHealth" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="3"><polygon fill="#333" points="0 0 10 3 0 6"/></marker><marker id="arrowHealthDashed" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="3"><polygon fill="#9E9E9E" points="0 0 10 3 0 6"/></marker></defs></svg>