<svg xmlns="http://www.w3.org/2000/svg" width="900" height="788" aria-label="Custom Webhook Authentication Flow — Azure Event Grid MQTT Broker" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" role="img" viewBox="0 0 900 788"><title>Custom Webhook Authentication Flow — Azure Event Grid MQTT</title><desc>End-to-end authentication flow. Three outcome paths: ALLOW to client authenticated, DENY to 200 Bad Request and authentication failed, ERROR to server unavailable.</desc><defs><marker id="arr-gray" markerHeight="7" markerWidth="7" orient="auto" refX="9" refY="4" viewBox="0 0 10 8"><path fill="#605E5C" d="M0 0 L10 4 L0 8 Z"/></marker><marker id="arr-red" markerHeight="7" markerWidth="7" orient="auto" refX="9" refY="4" viewBox="0 0 10 8"><path fill="#A4262C" d="M0 0 L10 4 L0 8 Z"/></marker><marker id="arr-green" markerHeight="7" markerWidth="7" orient="auto" refX="9" refY="4" viewBox="0 0 10 8"><path fill="#107C10" d="M0 0 L10 4 L0 8 Z"/></marker></defs><rect width="900" height="788" fill="#FAF9F8"/><rect width="900" height="58" x="0" y="0" fill="#FFF"/><line x1="0" x2="900" y1="58" y2="58" stroke="#C8C6C4" stroke-width="1"/><text x="32" y="30" fill="#323130" font-size="16" font-weight="600">Custom Webhook Authentication — End-to-End Flow</text><text x="32" y="48" fill="#605E5C" font-size="11.5">Azure Event Grid MQTT Broker · Entra ID token validation · Including error response paths</text><rect width="558" height="688" x="24" y="70" fill="#FFF" stroke="#C8C6C4" stroke-width="1" rx="4"/><text x="52" y="98" fill="#605E5C" font-size="10.5" font-weight="600" letter-spacing=".07em">AUTHENTICATION FLOW</text><rect width="528" height="96" x="52" y="108" fill="none" stroke="#C8C6C4" stroke-dasharray="6 4" stroke-width="1.5" rx="6"/><rect width="62" height="16" x="66" y="100" fill="#FFF"/><text x="69" y="112" fill="#605E5C" font-size="11.5" font-style="italic">Tenant A</text><rect width="348" height="64" x="142" y="118" fill="#5C2D91" stroke="#3B1D5E" stroke-widt